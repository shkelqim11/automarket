{% extends "base.html" %}{% load i18n %}
{% block content %}<div class="form-card" style="max-width:480px"><h1>{% trans "Sign up" %}</h1>
<form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}{% for f in form %}{% include "_field.html" %}{% endfor %}<p><button class="btn">{% trans "Create account" %}</button></p></form>
<p>{% trans "Already have an account?" %} <a href="{% url 'accounts:login' %}">{% trans "Log in" %}</a></p></div>{% endblock %}
