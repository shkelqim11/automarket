{% load i18n %}<a class="dealer-card" href="{{ d.get_absolute_url }}">
{% if d.logo %}<img src="{{ d.logo.url }}" alt="" loading="lazy">{% else %}<span class="dealer-logo"></span>{% endif %}
<span><strong>{{ d.name }}</strong><br><small>{{ d.city }}</small>{% if d.is_verified %}<br><span class="verified">✓ {% trans "Verified dealership" %}</span>{% endif %}</span></a>
